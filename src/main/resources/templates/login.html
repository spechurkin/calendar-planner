<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login}">Login</title>
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-page">

<div class="page-tools">
    <button class="theme-toggle"
            th:attr="data-dark-label=#{enable_dark_theme},data-light-label=#{enable_light_theme}"
            type="button">
        <svg aria-hidden="true" class="theme-icon theme-icon-moon" viewBox="0 0 24 24">
            <path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"
                  fill="none" stroke="currentColor" stroke-linecap="round"
                  stroke-linejoin="round" stroke-width="2"/>
        </svg>
        <svg aria-hidden="true" class="theme-icon theme-icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" fill="none" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                  fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        </svg>
    </button>
    <div class="lang-switch">
        <a th:href="@{/login(lang='en')}" title="English">🇺🇸</a>
        <a th:href="@{/login(lang='ru')}" title="Русский">🇷🇺</a>
    </div>
</div>

<div class="auth-card">
    <h1 th:text="#{login}">Login</h1>

    <p class="auth-message success" th:if="${param.registered}" th:text="#{registered_success}"></p>
    <p class="auth-message success" th:if="${param.logout}" th:text="#{logout_success}"></p>
    <p class="auth-message error" th:if="${param.error}" th:text="#{login_error}"></p>

    <form class="auth-form" method="post" th:action="@{/login}">
        <label>
            <span th:text="#{user}">Name</span>
            <input autocomplete="username" name="username" required type="text">
        </label>

        <label>
            <span th:text="#{password}">Password</span>
            <input autocomplete="current-password" name="password" required type="password">
        </label>

        <button th:text="#{login}" type="submit"></button>
    </form>

    <p class="auth-footer">
        <span th:text="#{no_account}">No account?</span>
        <a th:href="@{/signup}" th:text="#{signup}">Sign up</a>
    </p>
</div>

</body>
</html>
