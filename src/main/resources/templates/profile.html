<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{profile}">Profile</title>
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-page">

<div class="page-tools">
    <button class="theme-toggle"
            th:attr="data-dark-label=#{enable_dark_theme},data-light-label=#{enable_light_theme}"
            type="button">
        <svg aria-hidden="true" class="theme-icon theme-icon-moon" viewBox="0 0 24 24">
            <path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"
                  fill="none" stroke="currentColor" stroke-linecap="round"
                  stroke-linejoin="round" stroke-width="2"/>
        </svg>
        <svg aria-hidden="true" class="theme-icon theme-icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" fill="none" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                  fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
        </svg>
    </button>
</div>

<div class="auth-card profile-card">
    <h1 th:text="#{profile}">Profile</h1>

    <p class="auth-message success" th:if="${param.updated}" th:text="#{profile_updated}"></p>
    <p class="auth-message error" th:if="${error}" th:text="${error}"></p>

    <form class="auth-form" method="post" th:action="@{/profile}" th:object="${profile}">
        <label>
            <span th:text="#{user}">Display name</span>
            <input required th:field="${user.name}" type="text">
        </label>

        <label>
            <span th:text="#{color}">Color</span>
            <input class="color-input"
                   maxlength="7"
                   pattern="^#[0-9A-Fa-f]{6}$"
                   placeholder="#RRGGBB"
                   required
                   th:field="${user.color}"
                   type="text">
        </label>

        <label>
            <span th:text="#{new_password}">New password</span>
            <input autocomplete="new-password"
                   minlength="4"
                   type="password">
        </label>

        <button th:text="#{save_profile}" type="submit"></button>
    </form>

    <p class="auth-footer">
        <a th:href="@{/}" th:text="#{back_to_calendar}">Back to calendar</a>
    </p>
</div>

</body>
</html>
